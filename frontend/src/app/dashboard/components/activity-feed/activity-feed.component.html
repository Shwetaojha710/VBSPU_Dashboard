@let d = data();
<section class="panel">
  <header class="heading">
    <h2 class="heading__title">{{ d.title }}</h2>
    <a class="heading__link" [routerLink]="'/' + d.link">{{ d.linkLabel }}</a>
  </header>
  <ul class="list">
    @for (item of d.items; track $index) {
      <li>
        <a class="row" [routerLink]="'/' + d.link">
          <span class="row__text">
            <span class="row__title">{{ item.title }}</span>
            <span class="row__detail">{{ item.detail }}</span>
          </span>
          <span class="row__time">{{ item.time }}</span>
        </a>
      </li>
    }
  </ul>
</section>
