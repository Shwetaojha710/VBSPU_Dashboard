<!-- Added above the Figma screens (not part of the design frames): college-wise exam status. -->
<section class="exam-status" id="exam-status" aria-label="Exam status">
  <a class="tile" routerLink="/exam-status" aria-label="Exam status – appeared vs online, college-wise">
    <app-exam-status-card />
  </a>
</section>

<!-- Figma: University digital command centre screen 1 -->
<div class="screen" id="screen-1">
  <section class="stats" aria-label="Key metrics">
    @for (card of data().stats; track card.title; let i = $index) {
      <a class="tile" [routerLink]="'/' + (card.link ?? '')" [attr.aria-label]="card.title + ': ' + card.value">
        <app-stat-card [card]="card" [sparkline]="data().sparkline" [index]="i" />
      </a>
    }
  </section>

  <section class="panels">
    <a class="tile tile--wide" routerLink="/exams-certification" [attr.aria-label]="data().digitalEvaluation.title">
      <app-digital-evaluation [title]="data().digitalEvaluation.title" [metrics]="data().digitalEvaluation.metrics" />
    </a>
    <a class="tile" routerLink="/finance-hr-campus" [attr.aria-label]="data().feeCollection.title">
      <app-fee-collection [data]="data().feeCollection" />
    </a>
    <a class="tile" routerLink="/affiliation-colleges" [attr.aria-label]="data().affiliatedColleges.title">
      <app-affiliated-colleges [data]="data().affiliatedColleges" />
    </a>
  </section>

  <section class="charts">
    <a class="tile" routerLink="/student-academic" [attr.aria-label]="data().charts.enrollment.title">
      <app-bar-chart chartId="enrollment" [data]="data().charts.enrollment" [layout]="layouts().enrollment" />
    </a>
    <a class="tile" routerLink="/exams-certification" [attr.aria-label]="data().charts.examResults.title">
      <app-bar-chart chartId="exam" [data]="data().charts.examResults" [layout]="layouts().examResults" />
    </a>
    <a class="tile tile--wide" routerLink="/grievances" [attr.aria-label]="data().charts.grievances.title">
      <app-bar-chart chartId="grievance" [data]="data().charts.grievances" [layout]="layouts().grievances" />
    </a>
  </section>
</div>

<!-- Figma: University digital command centre screen 2 -->
<div class="screen" id="screen-2">
  <section class="s2-top">
    <app-research-quality [data]="data().screen2.researchQuality" />
    <div class="stack">
      <app-faculty-development [data]="data().screen2.facultyDevelopment" />
      <app-integrations [data]="data().screen2.integrations" />
    </div>
  </section>

  <section class="s2-mid">
    <div class="stack stack--wide">
      <app-metric-cards [data]="data().screen2.communication" [height]="137" />
      <app-metric-cards [data]="data().screen2.rti" [height]="132" [cardHeight]="59" />
    </div>
    <app-ai-insights [data]="data().screen2.aiInsights" />
  </section>

  <section class="s2-bottom">
    <app-funnel [data]="data().screen2.funnel" />
    <app-quick-access [data]="data().screen2.quickAccess" />
  </section>
</div>

<!-- Figma: University digital command centre screen 3 -->
<div class="screen" id="screen-3">
  <section class="s3">
    <app-activity-feed [data]="data().screen3.activity" />
    <app-events-calendar [data]="data().screen3.events" />
  </section>
</div>
