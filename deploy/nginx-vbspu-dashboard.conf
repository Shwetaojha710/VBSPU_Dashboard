server {
    listen 80;
    server_name vbspu-dashboard.demoquaeretech.in;

    root /var/www/html/vbspu-dashboard.demoquaeretech.in/frontend;
    index index.html;

    client_max_body_size 20M;

    # Help confirm this vhost is the one answering (remove after debug if desired)
    add_header X-Served-By vbspu-dashboard always;

    location /api/ {
        proxy_pass http://127.0.0.1:5060/api/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
